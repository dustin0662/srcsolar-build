name: Android APK

on:
  push:
    branches: [main, "claude/android-app"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build
        env:
          VITE_API_ORIGIN: https://srcsolar-build.netlify.app

      - name: Sync web bundle into Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/sunrise-portal-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sunrise-portal-debug-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error
